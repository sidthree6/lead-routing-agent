services:
  enrichment:
    # Built on the dev machine and pushed to GHCR. No build: section, because
    # Portainer Agent environments cannot build images (portainer#13255).
    image: ghcr.io/sidthree6/lead-routing-enrichment:0.1.0
    container_name: enrichment
    ports:
      - "8001:8000"
    restart: unless-stopped